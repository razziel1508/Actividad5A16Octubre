services:
  mariadb:
    image: 'bitnamilegacy/mariadb:12.0.2'
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_myapp
      - MARIADB_DATABASE=bitnami_myapp
      - MARIADB_PASSWORD=b1tnam1_my@pp
    ports:
      - '3307:3306'
    volumes:
      - 'mariadb_data:/bitnami/mariadb'
    networks:
      - laravel-network

  application:
    image: 'bitnamilegacy/laravel:12.3.1'
    environment:
      - LARAVEL_DATABASE_TYPE=mysql
      - LARAVEL_DATABASE_HOST=host.docker.internal
      - LARAVEL_DATABASE_PORT_NUMBER=3307
      - LARAVEL_DATABASE_NAME=bitnami_myapp
      - LARAVEL_DATABASE_USER=bn_myapp
      - LARAVEL_DATABASE_PASSWORD=b1tnam1_my@pp
      - LARAVEL_PORT_NUMBER=8000
      - LARAVEL_SKIP_COMPOSER_UPDATE=yes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '8000:8000'
    volumes:
      - './src:/app'
    depends_on:
      - mariadb
    networks:
      - laravel-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded   # <--- ESTA ES LA LÍNEA MÁGICA PARA CODESPACES
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - laravel-network

volumes:
  mariadb_data:
    driver: local
  keycloak_data:
    driver: local

networks:
  laravel-network:
    driver: bridge